name: jameel
description: Jameel employee application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.7
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  flutter_bloc: ^9.1.1
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.0.0
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  google_maps_flutter: ^2.14.0
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  firebase_storage: ^13.6.1
  firebase_crashlytics: ^5.4.1
  firebase_messaging: ^16.7.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  geocoding: ^5.0.1
  google_fonts: 8.0.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
